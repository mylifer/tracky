name: CI

on:
  push:
  pull_request:

# En az yetki: CI yalnızca kodu okur ve artifact yükler.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            probe: tracky-probe-macos-arm64
            exe: tracky-probe
            app: kum-macos-arm64
            bundles: app,dmg
            bundle_path: target/release/bundle/dmg/*.dmg
          - os: windows-latest
            probe: tracky-probe-windows-x64
            exe: tracky-probe.exe
            app: kum-windows-x64
            bundles: nsis
            bundle_path: target/release/bundle/nsis/*.exe
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Linux sistem kütüphaneleri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Arayüz
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Biçim
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Arayüz biçimi
        if: runner.os == 'Linux'
        working-directory: app
        run: npm run format:check
      - name: Arayüz testleri
        if: runner.os == 'Linux'
        working-directory: app
        run: npm test
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Çalışma alanında özellikler birleşir; çekirdeğin depo olmadan derlendiğini ayrıca denetle.
      - name: Çekirdek (store özelliği olmadan)
        if: runner.os == 'Linux'
        run: cargo check -p tracky-core --no-default-features
      - name: Testler
        run: cargo test --workspace

      - name: tracky-probe derle
        if: matrix.probe
        run: cargo build --release -p tracky-probe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.probe
        with:
          name: ${{ matrix.probe }}
          path: target/release/${{ matrix.exe }}

      # Sabit sertifikayla imza: Erişilebilirlik izni güncellemelerde korunur.
      - name: macOS imza sertifikası
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash .github/scripts/macos-keychain.sh

      - name: Kum uygulamasını paketle
        if: matrix.app
        working-directory: app
        # Güncelleme imzası yalnızca sürüm iş akışında (gizli anahtarla) üretilir.
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} --config "${{ github.workspace }}/app/src-tauri/tauri.ci.conf.json"

      - name: macOS imzasını doğrula
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: bash .github/scripts/macos-verify.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.app
        with:
          name: ${{ matrix.app }}
          path: ${{ matrix.bundle_path }}

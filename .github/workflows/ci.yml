name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            probe: tracky-probe-macos-arm64
            exe: tracky-probe
            app: kum-macos-arm64
            bundles: app,dmg
            bundle_path: target/release/bundle/dmg/*.dmg
          - os: windows-latest
            probe: tracky-probe-windows-x64
            exe: tracky-probe.exe
            app: kum-windows-x64
            bundles: nsis
            bundle_path: target/release/bundle/nsis/*.exe
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Linux sistem kütüphaneleri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Arayüz
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Biçim
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Testler
        run: cargo test --workspace

      - name: tracky-probe derle
        if: matrix.probe
        run: cargo build --release -p tracky-probe
      - uses: actions/upload-artifact@v4
        if: matrix.probe
        with:
          name: ${{ matrix.probe }}
          path: target/release/${{ matrix.exe }}

      - name: Kum uygulamasını paketle
        if: matrix.app
        working-directory: app
        # Güncelleme imzası yalnızca sürüm iş akışında (gizli anahtarla) üretilir.
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} --config "${{ github.workspace }}/app/src-tauri/tauri.ci.conf.json"

      - uses: actions/upload-artifact@v4
        if: matrix.app
        with:
          name: ${{ matrix.app }}
          path: ${{ matrix.bundle_path }}

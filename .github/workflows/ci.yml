name: CI

on:
  push:
  pull_request:

# En az yetki: CI yalnızca kodu okur ve artifact yükler.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            probe: tracky-probe-macos-arm64
            exe: tracky-probe
            app: kum-macos-arm64
            bundles: app,dmg
            bundle_path: target/release/bundle/dmg/*.dmg
          - os: windows-latest
            probe: tracky-probe-windows-x64
            exe: tracky-probe.exe
            app: kum-windows-x64
            bundles: nsis
            bundle_path: target/release/bundle/nsis/*.exe
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Linux sistem kütüphaneleri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Arayüz
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Biçim
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Arayüz biçimi
        if: runner.os == 'Linux'
        working-directory: app
        run: npm run format:check
      - name: Arayüz testleri
        if: runner.os == 'Linux'
        working-directory: app
        run: npm test
      # Arayüz sahte arka uçla tarayıcıda (e2e/): Windows'taki WebView2 gibi Chromium, macOS'taki
      # WKWebView gibi WebKit.
      - name: Uçtan uca testler (Chromium)
        if: runner.os == 'Linux'
        working-directory: app
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium
      - name: Uçtan uca testler (WebKit)
        if: runner.os == 'macOS'
        working-directory: app
        run: |
          npx playwright install webkit
          npx playwright test --project=webkit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && runner.os != 'Windows'
        with:
          name: e2e-${{ runner.os }}
          path: app/playwright-report
          if-no-files-found: ignore
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Çalışma alanında özellikler birleşir; çekirdeğin depo olmadan derlendiğini ayrıca denetle.
      - name: Çekirdek (store özelliği olmadan)
        if: runner.os == 'Linux'
        run: cargo check -p tracky-core --no-default-features
      - name: Testler
        run: cargo test --workspace

      - name: tracky-probe derle
        if: matrix.probe
        run: cargo build --release -p tracky-probe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.probe
        with:
          name: ${{ matrix.probe }}
          path: target/release/${{ matrix.exe }}

      # Sabit sertifikayla imza: Erişilebilirlik izni güncellemelerde korunur.
      - name: macOS imza sertifikası
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash .github/scripts/macos-keychain.sh

      - name: Kum uygulamasını paketle
        if: matrix.app
        working-directory: app
        # Güncelleme imzası yalnızca sürüm iş akışında (gizli anahtarla) üretilir.
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} --config "${{ github.workspace }}/app/src-tauri/tauri.ci.conf.json"

      - name: macOS imzasını doğrula
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: bash .github/scripts/macos-verify.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.app
        with:
          name: ${{ matrix.app }}
          path: ${{ matrix.bundle_path }}

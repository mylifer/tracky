name: Sürüm

# Mac ve Windows paketlerini derleyip imzalı güncelleme dosyalarıyla bir GitHub Release'e ekler.
# İki yoldan başlar:
# - `v0.2.0` gibi bir etiket push'lanınca.
# - Bir dala sürümü artıran commit push'lanınca: `tauri.conf.json`'daki sürümün etiketi yoksa ve
#   en son sürümden yeniyse etiketi bu iş akışı oluşturur. Claude oturumları yalnızca kendi
#   dallarına yazabildiği için sürümü böyle çıkarır.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - app/src-tauri/tauri.conf.json
      - .github/workflows/release.yml

permissions:
  contents: write

# Aynı anda iki dal aynı sürümü etiketlemeye kalkmasın.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Yayınlanacak etiket; boşsa (sürüm zaten etiketli ya da eski) yayın yapılmaz.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v$(jq -r .version app/src-tauri/tauri.conf.json)"
          if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "$tag zaten var; yayın yapılmıyor."
            exit 0
          fi
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$tag" | sort -V | tail -1)" != "$tag" ]; then
            echo "$tag en son sürümden ($latest) eski; yayın yapılmıyor."
            exit 0
          fi
          # GITHUB_TOKEN ile push'lanan etiket bu iş akışını yeniden başlatmaz; yayın burada sürer.
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Sürüm notları: önceki etiketten bu yana feat/fix/perf commit'leri. Uygulama kurulan sürümün
  # notlarını ilk açılışta "Yenilikler" olarak gösterir (latest.json'daki `notes`).
  notes:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          {
            echo 'body<<NOTES_EOF'
            python3 .github/scripts/release-notes.py "$TAG"
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.os }}
    needs: [prepare, notes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Sürüm numarası etiketle aynı mı?
        shell: bash
        run: |
          want="${TAG#v}"
          have=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "$want" != "$have" ]; then
            echo "Etiket $TAG ama tauri.conf.json sürümü $have" >&2
            exit 1
          fi

      - name: Arayüz bağımlılıkları
        working-directory: app
        run: npm ci

      # Sabit sertifikayla imza: Erişilebilirlik izni güncellemelerde korunur.
      - name: macOS imza sertifikası
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash .github/scripts/macos-keychain.sh

      # Paketleri derler, güncelleme imzalarını üretir ve `latest.json` ile
      # birlikte taslak Release'e yükler. Taslak, iki işletim sisteminin paketi
      # de yüklendikten sonra `publish` işinde yayınlanır: yoksa önce biten işin
      # `latest.json`'u diğer sistemin kaydı olmadan görünür ve o sistemdeki
      # uygulama "bu sistem için paket yok" der.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Varsayılan Supabase projesi: yeni cihazda yalnızca giriş yapmak yeter.
          KUM_SUPABASE_URL: ${{ vars.KUM_SUPABASE_URL }}
          KUM_SUPABASE_ANON_KEY: ${{ vars.KUM_SUPABASE_ANON_KEY }}
        with:
          projectPath: app
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: Kum ${{ needs.prepare.outputs.tag }}
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

      - name: macOS imzasını doğrula
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: bash .github/scripts/macos-verify.sh

  # Uygulama içi güncelleyici `releases/latest`'i okur; taslaklar orada görünmez.
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Release'i yayınla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

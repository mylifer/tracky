name: Sürüm

# `v0.2.0` gibi bir etiket push'landığında Mac ve Windows paketlerini
# derleyip imzalı güncelleme dosyalarıyla bir GitHub Release'e ekler.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Sürüm numarası etiketle aynı mı?
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "$want" != "$have" ]; then
            echo "Etiket $GITHUB_REF_NAME ama tauri.conf.json sürümü $have" >&2
            exit 1
          fi

      - name: Arayüz bağımlılıkları
        working-directory: app
        run: npm ci

      # Sabit sertifikayla imza: Erişilebilirlik izni güncellemelerde korunur.
      - name: macOS imza sertifikası
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash .github/scripts/macos-keychain.sh

      # Paketleri derler, güncelleme imzalarını üretir ve `latest.json` ile
      # birlikte Release'e yükler. Uygulama içi güncelleyici bu dosyayı okur;
      # bu yüzden Release taslak değil, yayınlanmış olmalı.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Kum ${{ github.ref_name }}
          releaseBody: Güncellemeler uygulama içinden otomatik indirilir.
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

      - name: macOS imzasını doğrula
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: bash .github/scripts/macos-verify.sh

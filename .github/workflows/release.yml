name: Sürüm

# `v0.2.0` gibi bir etiket push'landığında Mac ve Windows paketlerini
# derleyip imzalı güncelleme dosyalarıyla bir GitHub Release'e ekler.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Sürüm notları: önceki etiketten bu yana feat/fix/perf commit'leri. Uygulama kurulan sürümün
  # notlarını ilk açılışta "Yenilikler" olarak gösterir (latest.json'daki `notes`).
  notes:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: notes
        run: |
          {
            echo 'body<<NOTES_EOF'
            python3 .github/scripts/release-notes.py "$GITHUB_REF_NAME"
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.os }}
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Sürüm numarası etiketle aynı mı?
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "$want" != "$have" ]; then
            echo "Etiket $GITHUB_REF_NAME ama tauri.conf.json sürümü $have" >&2
            exit 1
          fi

      - name: Arayüz bağımlılıkları
        working-directory: app
        run: npm ci

      # Sabit sertifikayla imza: Erişilebilirlik izni güncellemelerde korunur.
      - name: macOS imza sertifikası
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash .github/scripts/macos-keychain.sh

      # Paketleri derler, güncelleme imzalarını üretir ve `latest.json` ile
      # birlikte taslak Release'e yükler. Taslak, iki işletim sisteminin paketi
      # de yüklendikten sonra `publish` işinde yayınlanır: yoksa önce biten işin
      # `latest.json`'u diğer sistemin kaydı olmadan görünür ve o sistemdeki
      # uygulama "bu sistem için paket yok" der.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Varsayılan Supabase projesi: yeni cihazda yalnızca giriş yapmak yeter.
          KUM_SUPABASE_URL: ${{ vars.KUM_SUPABASE_URL }}
          KUM_SUPABASE_ANON_KEY: ${{ vars.KUM_SUPABASE_ANON_KEY }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Kum ${{ github.ref_name }}
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

      - name: macOS imzasını doğrula
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: bash .github/scripts/macos-verify.sh

  # Uygulama içi güncelleyici `releases/latest`'i okur; taslaklar orada görünmez.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Release'i yayınla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

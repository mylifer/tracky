[package]
name = "kum"
version = "0.9.1"
edition = "2024"
description = "Pencerelerde geçen süreyi takip eden masaüstü uygulaması"

[lib]
name = "kum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tracky-core = { version = "0.1.0", path = "../../crates/tracky-core" }
tracky-platform = { version = "0.1.0", path = "../../crates/tracky-platform" }
tracky-sync = { version = "0.1.0", path = "../../crates/tracky-sync" }
tracky-xlsx = { version = "0.1.0", path = "../../crates/tracky-xlsx" }
ureq = "3.4.2"
uuid = { version = "1.26.1", features = ["v4"] }
window-vibrancy = "0.8.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
